<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
       body {
      font-family: cursive;
      text-align: center;
      background: linear-gradient(to right, pink, rgb(228, 154, 228));
      color: #333333;
      padding: 40px 20px;
      font-size: 30px;
     
    }

    h1 {
      color: #5e0263;
      font-size: 40px;
      margin-bottom: 30px;
    }

    .btn {
      background-color: #9e03a7;
      color: white;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(158, 3, 167, 0.2);
    }

    .btn:hover {
      background-color: #7b0282;
    }

    .card {
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    .bg-warning {
        background-color: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
     }
    .bg-primary { 
        background-color: #cce5ff;
        color: #004085; 
        border: 1px solid #b8daff; 
    }
    .bg-danger  {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
     }
    </style>
  </head>
  <body>
 <br>
 <br>
 <h1><strong>School Event Organizer</strong></h1>
 <hr>
 <button class="btn" onclick="eventdetails()">
    Click Me To Find The Details!
 </button>
     <br><hr><br>
 <div id="eventloading" class="card container bg-warning p-4 text-light">
    Empty! (Click the button!)
 </div>
<br><hr><br>
 <div id="eventstart" class="card container bg-primary p-4 text-light">
    Empty! (Click the button!)
 </div>
<br><hr><br>
  <div id="eventstart2" class="card container bg-danger p-4 text-light">
    Empty! (Click the button!)
 </div>
<script>
 function waitforload() {
        return new Promise(function(resolve) {

            setTimeout(function() {
                resolve("Details Successfully loaded in!");
            },3000);
        });
    }
    async function eventdetails() {
        document.getElementById('eventloading').innerHTML = "Please Wait For The Details...... Loading";
        let result = await waitforload();
        document.getElementById('eventloading').innerHTML = result;
       
         document.getElementById('eventstart').innerHTML = jsontext+"<br>";

         document.getElementById('eventstart2').innerHTML = "Event : "+loadedorder.name+'<br>';
         document.getElementById('eventstart2').innerHTML += "Date : "+loadedorder.date+'<br>';
         document.getElementById('eventstart2').innerHTML += "Time : "+loadedorder.time+'<br>';
    }
    
        let event={
            name:'Annual Award Ceremony',
            date: "16 October 2026",
            time:"from 10:00 am"
                    }
         let jsontext = JSON.stringify(event);
        
        let loadedorder = JSON.parse(jsontext);
        </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
